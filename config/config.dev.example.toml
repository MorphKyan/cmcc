# 开发环境配置 (Development)
# 语音活动检测 (VAD) 配置
[vad]
chunk_size = 200
sample_rate = 16000
model = "fsmn-vad"
# VAD 最大切割音频时长(ms)
max_single_segment_time = 20000
save_audio_segments = true  # 开发环境建议开启以方便调试
# 历史缓冲区最大时长(秒)
history_buffer_duration_sec = 30
# 音频块队列最大容量
chunk_queue_maxsize = 10000
# 提取音频后保留的安全边界(秒)
safety_margin_sec = 5
# 语音/噪声阈值，越高越难触发VAD(排除噪声)，默认0.6
speech_noise_thres = 0.8
# 绝对静音分贝阈值，低于此值强制判定为静音（默认-100.0，相当于不生效）
decibel_thres = -100.0

# ASR 语音与声纹识别配置
[asr]
model_dir = "./models/sense-voice-small"
sample_rate = 16000
language = "auto"
use_itn = true
spk_model_path = "./models/wespeaker_resnet34.onnx"
spk_sim_threshold = 0.55
fallback_speaker_label = "环境音/非目标"
batch_size = 1

# 数据文件路径配置
[data]
media_data_path = "./data/media.csv"
devices_data_path = "./data/devices.csv"
areas_data_path = "./data/areas.csv"
doors_data_path = "./data/doors.csv"
hotwords_data_path = "./data/hotwords.json"

# RAG (检索增强生成) 配置
[rag]
# RAG 提供商选择: "ollama", "modelscope", 或 "dashscope"
provider = "ollama"  # 开发环境建议使用 Ollama
chroma_db_dir = "./chroma_db"
top_k_results = 10
# 分类检索 top_k 配置
door_top_k = 30
media_top_k = 30
device_top_k = 30
# Ollama 配置
ollama_embedding_model = "qwen3-embedding:0.6b"
ollama_base_url = "http://127.0.0.1:11434"

# 大语言模型 (LLM) 配置
[llm]
# LLM 提供商选择: "ollama" 或 "modelscope"
provider = "ollama"  # 开发环境建议使用 Ollama
# ollama 配置
ollama_model = "qwen3:8b"
ollama_base_url = "http://127.0.0.1:11434"

# Validation and retry settings
max_validation_retries = 2
retry_delay = 0.1
# Network timeout settings
request_timeout = 30  # 开发环境可能较慢，适当增加超时
connection_timeout = 10

# AEP中控系统配置
[aep]
# 开发环境通常直连中控模拟器或内网地址
base_url = "http://127.0.0.1:8088/aep/voice/command"
sign_salt = "cE0aM0qC0dB4aD2"
request_timeout = 10

# 文本转语音(TTS)配置
[tts]
model_dir = "./models/vits-melo-tts-zh_en"
speed = 1.0
speaker_id = 0
num_threads = 2
