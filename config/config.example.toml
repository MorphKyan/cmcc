# 语音活动检测 (VAD) 配置
[vad]
chunk_size = 200
sample_rate = 16000
model = "fsmn-vad"
# VAD 最大切割音频时长(ms)
max_single_segment_time = 20000
save_audio_segments = false
# 历史缓冲区最大时长(秒)
history_buffer_duration_sec = 30
# 音频块队列最大容量
chunk_queue_maxsize = 10000
# 提取音频后保留的安全边界(秒)
safety_margin_sec = 5
# 语音/噪声阈值，越高越难触发VAD(排除噪声)，默认0.6
speech_noise_thres = 0.8
# 绝对静音分贝阈值，低于此值强制判定为静音（默认-100.0，相当于不生效）
decibel_thres = -100.0

# ASR 语音与声纹识别配置 (基于 Sherpa-ONNX & ONNXRuntime)
[asr]
model_dir = "./models/sense-voice-small"
sample_rate = 16000
language = "auto"
use_itn = true
spk_model_path = "./models/wespeaker_resnet34.onnx"
spk_sim_threshold = 0.55
fallback_speaker_label = "环境音/非目标"
batch_size = 1

# 数据文件路径配置
[data]
media_data_path = "./data/media.csv"
devices_data_path = "./data/devices.csv"
areas_data_path = "./data/areas.csv"
doors_data_path = "./data/doors.csv"
hotwords_data_path = "./data/hotwords.json"

# RAG (检索增强生成) 配置
[rag]
# RAG 提供商选择: "ollama", "modelscope", 或 "dashscope"
provider = "ollama"
chroma_db_dir = "./chroma_db"
top_k_results = 10
# 分类检索 top_k 配置
door_top_k = 30
media_top_k = 30
device_top_k = 30
# Ollama 配置
ollama_embedding_model = "qwen3-embedding:0.6b"
ollama_base_url = "http://127.0.0.1:11434"
# ModelScope 配置
modelscope_embedding_model = "Qwen/Qwen3-Embedding-0.6B"
modelscope_base_url = "https://api-inference.modelscope.cn/v1"
modelscope_api_key = "ms-b5d21340-4551-4343-86e8-e1c1430ae1f9"
# DashScope 配置
dashscope_embedding_model = "text-embedding-v4"
dashscope_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
dashscope_api_key = "sk-5d29b7ca2f074ffea3b7de63c9348ee5"

# 大语言模型 (LLM) 配置
[llm]
# LLM 提供商选择: "ollama" 或 "modelscope"
provider = "modelscope"
# ollama 配置
ollama_model = "qwen3:8b"
ollama_base_url = "http://127.0.0.1:11434"
# ModelScope 配置
modelscope_model = "Qwen/Qwen3-30B-A3B-Instruct-2507"
modelscope_base_url = "https://api-inference.modelscope.cn/v1"
modelscope_api_key = "ms-b5d21340-4551-4343-86e8-e1c1430ae1f9"

# Validation and retry settings
max_validation_retries = 2
retry_delay = 0.1
# Network timeout settings
request_timeout = 10
connection_timeout = 10

# 火山引擎配置 (备用)
